name: Check Internship Listings

on:
  schedule:
    # Every 15 minutes. GitHub may delay scheduled runs slightly under load,
    # especially the first run after the workflow is enabled.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit state.json back

concurrency:
  group: internship-state-writer-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python check_internships.py

      - name: Commit updated state
        run: |
          set -euo pipefail
      
          git config user.name "internship-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
      
          git add state.json
      
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
      
          git commit -m "Update internship state [skip ci]"
      
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
      
            if git push origin HEAD:main; then
              exit 0
            fi
      
            echo "Push failed; retrying..."
            sleep $((attempt * 2))
          done
      
          echo "Failed to push state after retries."
          exit 1
